name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: online/package-lock.json

      - name: Install online app dependencies
        working-directory: online
        run: npm ci

      - name: Build online app
        working-directory: online
        run: npm run build

      - name: Prepare static site
        run: |
          mkdir -p _site/online
          cp index.html _site/index.html
          cp favicon.svg _site/favicon.svg
          cp pokemon_data.js _site/pokemon_data.js
          cp -R online/dist/* _site/online/
          touch _site/.nojekyll

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
